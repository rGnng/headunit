# Music Player Daemon configuration for the head-unit development setup.
# Uses a null audio output so nothing is ever played to the speakers.

music_directory     "C:/Users/Administrator/Documents/headunit/media/music"
playlist_directory  "C:/Users/Administrator/Documents/headunit/media/playlists"
db_file             "C:/Users/Administrator/Documents/headunit/media/mpd/tag_cache"
state_file          "C:/Users/Administrator/Documents/headunit/media/mpd/state"
pid_file            "C:/Users/Administrator/Documents/headunit/media/mpd/pid"
log_file            "C:/Users/Administrator/Documents/headunit/media/mpd/log"

bind_to_address     "0.0.0.0"
port                "6600"

# Discard all audio: the daemon runs silently for interface testing.
audio_output {
    type        "null"
    name        "Silent Output"
    # Keep the volume controls functional without audio hardware.
    mixer_type  "software"
}

auto_update         "yes"
